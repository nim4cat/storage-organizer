<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Material Organizer</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .auth-container, .app-container { max-width: 1200px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .auth-container { max-width: 400px; margin-top: 100px; text-align: center; }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        button.logout-btn { background: #64748b; width: auto; float: right; }
        .low-stock { border: 2px solid var(--warning) !important; background-color: #fffbeb; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; position: relative; background: var(--card); }
        .badge { display: inline-block; background: #e2e8f0; border-radius: 12px; padding: 2px 8px; font-size: 12px; margin-right: 5px; }
        .alert-text { color: var(--danger); font-weight: bold; font-size: 14px; }
        .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    </style>
</head>
<body>

    <!-- 🔐 SECURE LOGIN SCREEN -->
    <div id="authSection" class="auth-container">
        <h2>Storage Organizer Login</h2>
        <input type="email" id="loginEmail" placeholder="Email Address">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Sign In</button>
        <p id="authError" style="color: var(--danger);"></p>
    </div>

    <!-- 📦 MAIN SYSTEM DASHBOARD -->
    <div id="appSection" class="app-container hidden">
        <div class="nav">
            <h2>My Storage Dashboard</h2>
            <button id="logoutBtn" class="logout-btn">Sign Out</button>
        </div>

        <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-top: 20px;">
            <h3>🔍 Search & Filter</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                <input type="text" id="searchName" placeholder="Search by name...">
                <input type="text" id="searchLocation" placeholder="Filter by Location">
            </div>
        </div>

        <h3>Current Inventory</h3>
        <div id="inventoryGrid" class="grid">
             <p>Loading your materials database...</p>
        </div>
    </div>

    <script>
        // 🛠️ CHANGE THESE PLACEHOLDERS TO YOUR REAL PROJECT STRINGS
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.your-actual-anon-key-string..."; 


        // State trackers
        let sessionToken = localStorage.getItem('supabase_token') || null;

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const authError = document.getElementById('authError');

        // Check login status on page refresh
        if (sessionToken) {
            showDashboard();
        }

        // --- 🔐 NATIVE FETCH AUTHENTICATION ---
        loginBtn.addEventListener('click', async () => {
            authError.textContent = "";
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: loginEmail.value, password: loginPassword.value })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error_description || data.message || "Login failed");

                localStorage.setItem('supabase_token', data.access_token);
                sessionToken = data.access_token;
                showDashboard();
            } catch (error) {
                authError.textContent = error.message;
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('supabase_token');
            sessionToken = null;
            authSection.classList.remove('hidden');
            appSection.classList.add('hidden');
        });

        function showDashboard() {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            loadInventory();
        }

        // --- 📦 DATA FETCH VIA DIRECT API ---
        async function loadInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = "";

            try {
                // Fetching from a custom database table called 'materials'
                const response = await fetch(`${SUPABASE_URL}/rest/v1/materials?select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${sessionToken}`
                    }
                });

                if (!response.ok) throw new Error("Could not load table data. Set up your Supabase database table!");
                const materials = await response.json();

                if (materials.length === 0) {
                    grid.innerHTML = "<p>Login successful! Database connection active. Ready to build your asset schemas!</p>";
                    return;
                }

                materials.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<h4>${item.material_name}</h4><p>Qty: ${item.quantity}</p>`;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = `<p style="color:red;">Database message: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
