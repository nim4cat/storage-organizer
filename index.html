    <script>
        // 🛠️ PASTE YOUR REAL SUPABASE DATA HERE
        const SUPABASE_URL = "https://jscwjoreayijmoechkwh.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IQoRMrtpuA2LZXCcDKtfpg_f-g2Tqwo"; 

        let sessionToken = localStorage.getItem('supabase_token') || null;
        let userId = localStorage.getItem('supabase_uid') || null;
        let localInventoryCached = [];

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const authError = document.getElementById('authError');
        const materialForm = document.getElementById('materialForm');

        if (sessionToken) { showDashboard(); }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            authError.textContent = "Connecting to database...";
            authError.style.color = "var(--primary)";
            loginBtn.disabled = true;
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: loginEmail.value.trim(), password: loginPassword.value })
                });
                const data = await response.json();
                if (!response.ok) { throw new Error(data.error_description || data.error || data.message || "Invalid credentials"); }
                localStorage.setItem('supabase_token', data.access_token);
                localStorage.setItem('supabase_uid', data.user.id);
                sessionToken = data.access_token;
                userId = data.user.id;
                authError.textContent = "";
                showDashboard();
            } catch (error) { 
                authError.textContent = "❌ " + error.message; 
                authError.style.color = "var(--danger)";
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.clear();
            window.location.reload();
        });

        function showDashboard() {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            loadInventory();
        }

        materialForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const tagsArray = document.getElementById('matTags').value.split(',').map(t => t.trim()).filter(t => t.length > 0);
            const payload = {
                material_name: document.getElementById('matName').value,
                location: document.getElementById('matLoc').value,
                quantity: parseInt(document.getElementById('matQty').value) || 0,
                min_threshold: parseInt(document.getElementById('matAlert').value) || 0,
                image_url: document.getElementById('matImg').value || null,
                manual_url: document.getElementById('matManual').value || null,
                tutorial_url: document.getElementById('matTutorial').value || null,
                description: document.getElementById('matDesc').value || null,
                tags: tagsArray,
                user_id: userId
            };
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/materials`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${sessionToken}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error("Insertion failed");
                materialForm.reset();
                loadInventory();
            } catch (err) { alert("Error saving material: " + err.message); }
        });

        async function loadInventory() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/materials?select=*`, {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${sessionToken}` }
                });
                if (!response.ok) throw new Error("Could not download rows.");
                localInventoryCached = await response.json();
                renderFilteredInventory();
            } catch (err) { document.getElementById('inventoryGrid').innerHTML = `<p style="color:red;">Error: ${err.message}</p>`; }
        }

        window.adjustStock = async function(id, currentQty, actionType) {
            let adjustNum = prompt(`How many units are you taking ${actionType === 'IN' ? 'in' : 'out'}?`);
            if (!adjustNum || isNaN(adjustNum) || parseInt(adjustNum) <= 0) return;
            adjustNum = parseInt(adjustNum);
            let note = prompt(actionType === 'IN' ? "Enter Source location/notes:" : "Enter Destination location/notes:");
            let newQty = actionType === 'IN' ? currentQty + adjustNum : currentQty - adjustNum;
            if (newQty < 0) { alert("Error: Quantity cannot drop below 0."); return; }
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/materials?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${sessionToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: newQty })
                });
                await fetch(`${SUPABASE_URL}/rest/v1/transactions`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${sessionToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ material_id: id, type: actionType, quantity_changed: adjustNum, party_or_place: note || 'Unspecified' })
                });
                loadInventory();
            } catch (e) { alert("Transaction log failed: " + e.message); }
        };

        function renderFilteredInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = "";
            const sName = document.getElementById('searchName').value.toLowerCase();
            const sLoc = document.getElementById('searchLocation').value.toLowerCase();
            const sTag = document.getElementById('searchTag').value.toLowerCase();
            const fStock = document.getElementById('filterStock').value;
            const sorting = document.getElementById('sortOrder').value;

            let filtered = localInventoryCached.filter(item => {
                const matchName = item.material_name.toLowerCase().includes(sName);
                const matchLoc = (item.location || "").toLowerCase().includes(sLoc);
                const matchTag = sTag === "" || (item.tags || []).some(t => t.toLowerCase().includes(sTag));
                const matchAlert = fStock === "all" || (item.quantity <= (item.min_threshold || 0));
                return matchName && matchLoc && matchTag && matchAlert;
            });

            filtered.sort((a, b) => {
                if (sorting === "name_asc") return a.material_name.localeCompare(b.material_name);
                if (sorting === "name_desc") return b.material_name.localeCompare(a.material_name);
                if (sorting === "qty_desc") return b.quantity - a.quantity;
                return 0;
            });

            if (filtered.length === 0) {
                grid.innerHTML = "<p>No matching materials found in storage.</p>";
                return;
            }

            filtered.forEach(item => {
                const isLow = item.quantity <= (item.min_threshold || 0);
                const card = document.createElement('div');
                card.className = `card ${isLow ? 'low-stock' : ''}`;
                const imgMarkup = item.image_url ? `<img class="card-img" src="${item.image_url}" alt="${item.material_name}">` : `<div class="card-img">📷 No Asset Photo Included</div>`;
                card.innerHTML = `
                    <div>
                        ${imgMarkup}
                        <h4 style="margin:4px 0;">${item.material_name}</h4>
                        <p style="font-size:13px; color:#475569; margin:4px 0;">${item.description || 'No description supplied.'}</p>
                        <p style="margin:6px 0; font-size:14px;"><strong>Location:</strong> 📍 ${item.location}</p>
                        <p style="margin:6px 0; font-size:14px;"><strong>Quantity:</strong> ${item.quantity} ${isLow ? '<span class="alert-text">⚠️ LOW STOCK ALERT</span>' : ''}</p>
                        <div style="margin-top:5px;">${(item.tags || []).map(t => `<span class="badge">${t}</span>`).join('')}</div>
                    </div>
                    <div style="margin-top:15px; border-top:1px solid #f1f5f9; padding-top:10px;">
                        <div class="links-group">
                            ${item.manual_url ? `<a href="${item.manual_url}" target="_blank">📋 User Manual</a>` : ''}
                            ${item.tutorial_url ? `<a href="${item.tutorial_url}" target="_blank">🎥 Tutorial Video</a>` : ''}
                        </div>
                        <div style="margin-top:10px; display:flex; justify-content:space-between;">
                            <button class="action-btn" style="background:#10b981;" onclick="adjustStock(${item.id}, ${item.quantity}, 'IN')">➕ Put In</button>
