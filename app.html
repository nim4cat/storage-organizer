<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Material Organizer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .auth-container { max-width: 400px; margin: 100px auto 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; }
        .app-container { max-width: 1200px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        button.logout-btn { background: #64748b; width: auto; float: right; padding: 8px 16px; margin: 0; }
        button.action-btn { width: auto; padding: 6px 12px; margin: 4px; font-size: 12px; }
        button.out-btn { background: var(--danger); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; position: relative; background: var(--card); display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 3px rgb(0 0 0 / 0.05); }
        .low-stock { border: 2px solid var(--warning) !important; background-color: #fffbeb; }
        .badge { display: inline-block; background: #e2e8f0; border-radius: 12px; padding: 2px 8px; font-size: 12px; margin-right: 5px; margin-top: 5px; font-weight: 500; }
        .alert-text { color: var(--danger); font-weight: bold; font-size: 12px; background: #fee2e2; padding: 2px 6px; border-radius: 4px; }
        .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .form-section { background: #f1f5f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .flex-group { display: flex; gap: 10px; }
        .links-group a { font-size: 13px; color: var(--primary); text-decoration: none; margin-right: 12px; font-weight: 500; }
        .links-group a:hover { text-decoration: underline; }
        .card-img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>

    <!-- 🔐 SECURE LOGIN SCREEN -->
    <div id="authSection" class="auth-container">
        <h2>Storage Organizer Login</h2>
        <input type="email" id="loginEmail" placeholder="Email Address">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Sign In</button>
        <p id="authError" style="color: var(--danger); font-weight: bold; margin-top: 10px;"></p>
    </div>

    <!-- 📦 MAIN SYSTEM DASHBOARD -->
    <div id="appSection" class="app-container hidden">
        <div class="nav">
            <h2>📦 Storage Material Organizer</h2>
            <button id="logoutBtn" class="logout-btn">Sign Out</button>
        </div>

        <!-- ➕ ADD NEW MATERIAL PANEL -->
        <div class="form-section">
            <h3>➕ Add New Material Entry</h3>
            <form id="materialForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
                    <input type="text" id="matName" placeholder="Material Name (e.g. Cordless Drill)" required>
                    <input type="text" id="matLoc" placeholder="Storage Location (e.g. Box B, Garage)" required>
                    <input type="number" id="matQty" placeholder="Initial Quantity" value="1" min="0" required>
                    <input type="number" id="matAlert" placeholder="Low-Stock Alert Threshold" value="2" min="0" required>
                    <input type="text" id="matTags" placeholder="Tags (comma separated: Tools, Power, Cordless)">
                    <input type="url" id="matImg" placeholder="Photo URL Link (or web image link)">
                    <input type="url" id="matManual" placeholder="User Manual Link (URL)">
                    <input type="url" id="matTutorial" placeholder="Video Tutorial Link (URL)">
                </div>
                <textarea id="matDesc" placeholder="Brief material description or special details..." rows="2"></textarea>
                <button type="submit" style="background-color: #10b981;">Save to Cloud Inventory</button>
            </form>
        </div>

        <!-- 🔍 SEARCH, CONTROLS & QUERY FILTERS -->
        <div class="form-section" style="background: #e2e8f0;">
            <h3>🔍 Active Search & Engine Filters</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                <input type="text" id="searchName" placeholder="Search by name...">
                <input type="text" id="searchLocation" placeholder="Filter by Location...">
                <input type="text" id="searchTag" placeholder="Filter by Tag...">
                <select id="filterStock">
                    <option value="all">All Items</option>
                    <option value="low">⚠️ Low Stock Alerts Only</option>
                </select>
                <select id="sortOrder">
                    <option value="name_asc">Sort: Name (A-Z)</option>
                    <option value="name_desc">Sort: Name (Z-A)</option>
                    <option value="qty_desc">Sort: Quantity (High to Low)</option>
                </select>
            </div>
        </div>

        <!-- INVENTORY SYSTEM DISPLAY GRID -->
        <h3>Current Box Inventory</h3>
        <div id="inventoryGrid" class="grid">
             <p>Loading database data...</p>
        </div>
    </div>

    <script>
        // 🛠️ REMEMBER TO PASTE YOUR REAL SUPABASE DETAILS HERE INSIDE THE QUOTES
        const SUPABASE_URL = "https://jscwjoreayijmoechkwh.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IQoRMrtpuA2LZXCcDKtfpg_f-g2Tqwo"; 

        let sessionToken = localStorage.getItem('supabase_token') || null;
        let userId = localStorage.getItem('supabase_uid') || null;
        let localInventoryCached = [];

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const authError = document.getElementById('authError');
        const materialForm = document.getElementById('materialForm');

        if (sessionToken) { showDashboard(); }

        // --- AUTH LOGIC WITH REAL-TIME ON-SCREEN STATUS ---
        loginBtn.addEventListener('click', async () => {
            authError.textContent = "Connecting to database...";
            authError.style.color = "var(--primary)";
            loginBtn.disabled = true;
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: loginEmail.value.trim(), password: loginPassword.value })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error_description || data.error || data.message || "Invalid credentials");
                }
                
                localStorage.setItem('supabase_token', data.access_token);
                localStorage.setItem('supabase_uid', data.user.id);
                sessionToken = data.access_token;
                userId = data.user.id;
                
                authError.textContent = "";
                showDashboard();
            } catch (error) { 
                authError.textContent = "❌ Error: " + error.message; 
                authError.style.color = "var(--danger)";
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.clear();
            window.location.reload();
        });

        function showDashboard() {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            loadInventory();
        }

        // --- SUBMIT NEW MATERIAL DATA ---
        materialForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const tagsArray = document.getElementById('matTags').value.split(',')
                .map(t => t.trim()).filter(t => t.length > 0);

            const payload = {
                material_name: document.getElementById('matName').value,
                location: document.getElementById('matLoc').value,
                quantity: parseInt(document.getElementById('matQty').value) || 0,
                min_threshold: parseInt(document.getElementById('matAlert').value) || 0,
                image_url: document.getElementById('matImg').value || null,manual_url: document.getElementById('matManual').value || null,tutorial_url: document.getElementById('matTutorial').value || null,description: document.getElementById('matDesc').value || null,tags: tagsArray,user_id: userId};try {const res = await fetch(${SUPABASE_URL}/rest/v1/materials, {method: 'POST',headers: {'apikey': SUPABASE_KEY,'Authorization': Bearer ${sessionToken},'Content-Type': 'application/json','Prefer': 'return=representation'},body: JSON.stringify(payload)});if (!res.ok) throw new Error("Insertion failed script error");materialForm.reset();loadInventory();} catch (err) { alert("Error saving material: " + err.message); }});// --- LIVE MASTER INVENTORY DATA FETCH ---async function loadInventory() {try {const response = await fetch(${SUPABASE_URL}/rest/v1/materials?select=*, {method: 'GET',headers: { 'apikey': SUPABASE_KEY, 'Authorization': Bearer ${sessionToken} }});if (!response.ok) throw new Error("Could not download system rows.");localInventoryCached = await response.json();renderFilteredInventory();} catch (err) {document.getElementById('inventoryGrid').innerHTML = <p style="color:red;">Error: ${err.message}</p>;}}// --- TRANSACTION LEDGER CONTROLS (IN / OUT ENGINE) ---window.adjustStock = async function(id, currentQty, actionType) {let adjustNum = prompt(How many units are you taking ${actionType === 'IN' ? 'in' : 'out'}?);if (!adjustNum || isNaN(adjustNum) || parseInt(adjustNum) <= 0) return;adjustNum = parseInt(adjustNum);let note = prompt(actionType === 'IN' ? "Enter Source location/notes:" : "Enter Destination location/notes:");let newQty = actionType === 'IN' ? currentQty + adjustNum : currentQty - adjustNum;if (newQty < 0) { alert("Error: Quantity cannot drop below 0."); return; }try {await fetch(${SUPABASE_URL}/rest/v1/materials?id=eq.${id}, {method: 'PATCH',headers: {'apikey': SUPABASE_KEY,'Authorization': Bearer ${sessionToken},'Content-Type': 'application/json'},body: JSON.stringify({ quantity: newQty })});await fetch(${SUPABASE_URL}/rest/v1/transactions, {method: 'POST',headers: {'apikey': SUPABASE_KEY,'Authorization': Bearer ${sessionToken},'Content-Type': 'application/json'},body: JSON.stringify({material_id: id,type: actionType,quantity_changed: adjustNum,party_or_place: note || 'Unspecified'})});loadInventory();} catch (e) { alert("Transaction log failed: " + e.message); }};// --- SORT & MULTI-FILTER LIST ENGINES ---function renderFilteredInventory() {const grid = document.getElementById('inventoryGrid');grid.innerHTML = "";const sName = document.getElementById('searchName').value.toLowerCase();const sLoc = document.getElementById('searchLocation').value.toLowerCase();const sTag = document.getElementById('searchTag').value.toLowerCase();const fStock = document.getElementById('filterStock').value;const sorting = document.getElementById('sortOrder').value;let filtered = localInventoryCached.filter(item => {const matchName = item.material_name.toLowerCase().includes(sName);const matchLoc = (item.location || "").toLowerCase().includes(sLoc);const matchTag = sTag === "" || (item.tags || []).some(t => t.toLowerCase().includes(sTag));const matchAlert = fStock === "all" || (item.quantity <= (item.min_threshold || 0));return matchName && matchLoc && matchTag && matchAlert;});filtered.sort((a, b) => {if (sorting === "name_asc") return a.material_name.localeCompare(b.material_name);if (sorting === "name_desc") return b.material_name.localeCompare(a.material_name);if (sorting === "qty_desc") return b.quantity - a.quantity;return 0;});if (filtered.length === 0) {grid.innerHTML = "No matching materials found in storage matching your query filters.";return;}filtered.forEach(item => {const isLow = item.quantity <= (item.min_threshold || 0);const card = document.createElement('div');card.className = card ${isLow ? 'low-stock' : ''};const imgMarkup = item.image_url? <img class="card-img" src="${item.image_url}" alt="${item.material_name}">: <div class="card-img">📷 No Asset Photo Included</div>;card.innerHTML = <div> ${imgMarkup} <h4 style="margin:4px 0;">${item.material_name}</h4> <p style="font-size:13px; color:#475569; margin:4px 0;">${item.description || 'No description supplied.'}</p> <p style="margin:6px 0; font-size:14px;"><strong>Location:</strong> 📍 ${item.location}</p> <p style="margin:6px 0; font-size:14px;"><strong>Quantity:</strong> ${item.quantity} ${isLow ? '<span class="alert-text">⚠️ LOW STOCK ALERT</span>' : ''}</p> <div style="margin-top:5px;"> ${(item.tags || []).map(t =>${t}).join('')} </div> </div> <div style="margin-top:15px; border-top:1px solid #f1f5f9; padding-top:10px;"> <div class="links-group"> ${item.manual_url ? 📋 User Manual: ''} ${item.tutorial_url ?🎥 Tutorial Video: ''} </div> <div style="margin-top:10px; display:flex; justify-content:space-between;"> <button class="action-btn" style="background:#10b981;" onclick="adjustStock(${item.id}, ${item.quantity}, 'IN')">➕ Put In</button> <button class="action-btn out-btn" onclick="adjustStock(${item.id}, ${item.quantity}, 'OUT')">➖ Take Out</button> </div> </div>;grid.appendChild(card);});}document.getElementById('searchName').addEventListener('input', renderFilteredInventory);document.getElementById('searchLocation').addEventListener('input', renderFilteredInventory);document.getElementById('searchTag').addEventListener('input', renderFilteredInventory);document.getElementById('filterStock').addEventListener('change', renderFilteredInventory);document.getElementById('sortOrder').addEventListener('change', renderFilteredInventory);
