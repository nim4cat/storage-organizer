<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Material Organizer - version 1</title>
    <!-- 1. Load the official standalone Supabase library bundle safely -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .auth-container { max-width: 400px; margin: 100px auto 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; }
        .app-container { max-width: 1200px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        button.logout-btn { background: #64748b; width: auto; float: right; padding: 8px 16px; margin: 0; }
        button.action-btn { width: auto; padding: 6px 12px; margin: 4px; font-size: 12px; }
        button.out-btn { background: var(--danger); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; position: relative; background: var(--card); display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 3px rgb(0 0 0 / 0.05); }
        .low-stock { border: 2px solid var(--warning) !important; background-color: #fffbeb; }
        .badge { display: inline-block; background: #e2e8f0; border-radius: 12px; padding: 2px 8px; font-size: 12px; margin-right: 5px; margin-top: 5px; font-weight: 500; }
        .alert-text { color: var(--danger); font-weight: bold; font-size: 12px; background: #fee2e2; padding: 2px 6px; border-radius: 4px; }
        .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .form-section { background: #f1f5f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .flex-group { display: flex; gap: 10px; }
        .links-group a { font-size: 13px; color: var(--primary); text-decoration: none; margin-right: 12px; font-weight: 500; }
        .links-group a:hover { text-decoration: underline; }
        .card-img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>

    <!-- 🔐 SIGN IN BOX -->
    <div id="authSection" class="auth-container">
        <h2>Storage Organizer Login - Version 1.0 </h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email Address" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit" id="loginBtn">Sign In</button>
        </form>
        <p id="authError" style="color: var(--danger); font-weight: bold; margin-top: 10px; min-height: 20px;"></p>
    </div>

    <!-- 📦 APP MAIN WORKSPACE -->
    <div id="appSection" class="app-container hidden">
        <div class="nav">
            <h2>📦 Storage Material Organizer - new version </h2>
            <button id="logoutBtn" class="logout-btn">Sign Out</button>
        </div>

        <div class="form-section">
            <h3>➕ Add New Material Entry</h3>
            <form id="materialForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
                    <input type="text" id="matName" placeholder="Material Name (e.g. Cordless Drill)" required>
                    <input type="text" id="matLoc" placeholder="Storage Location (e.g. Box B, Garage)" required>
                    <input type="number" id="matQty" placeholder="Initial Quantity" value="1" min="0" required>
                    <input type="number" id="matAlert" placeholder="Low-Stock Alert Threshold" value="2" min="0" required>
                    <input type="text" id="matTags" placeholder="Tags (comma separated: Tools, Power, Cordless)">
                    <input type="url" id="matImg" placeholder="Photo URL Link (or web image link)">
                    <input type="url" id="matManual" placeholder="User Manual Link (URL)">
                    <input type="url" id="matTutorial" placeholder="Video Tutorial Link (URL)">
                </div>
                <textarea id="matDesc" placeholder="Brief material description or special details..." rows="2"></textarea>
                <button type="submit" style="background-color: #10b981;">Save to Cloud Inventory</button>
            </form>
        </div>

        <div class="form-section" style="background: #e2e8f0;">
            <h3>🔍 Active Search & Engine Filters</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                <input type="text" id="searchName" placeholder="Search by name...">
                <input type="text" id="searchLocation" placeholder="Filter by Location...">
                <input type="text" id="searchTag" placeholder="Filter by Tag...">
                <select id="filterStock">
                    <option value="all">All Items</option>
                    <option value="low">⚠️ Low Stock Alerts Only</option>
                </select>
                <select id="sortOrder">
                    <option value="name_asc">Sort: Name (A-Z)</option>
                    <option value="name_desc">Sort: Name (Z-A)</option>
                    <option value="qty_desc">Sort: Quantity (High to Low)</option>
                </select>
            </div>
        </div>

        <h3>Current Box Inventory</h3>
        <div id="inventoryGrid" class="grid">
             <p>Loading database data...</p>
        </div>
    </div>

    <!-- ⚙️ OFFICIAL DATABASE ENGINE HANDLER -->
    <script>
        // 🛠️ CONFIGURATION STRINGS (Paste your real values inside the quotes)
        const YOUR_URL = "https://jscwjoreayijmoechkwh.supabase.co"; 
        const YOUR_KEY = "sb_publishable_IQoRMrtpuA2LZXCcDKtfpg_f-g2Tqwo"; 

        // Initialize the browser SDK instance client 
        const supabase = window.supabase.createClient(YOUR_URL, YOUR_KEY);

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const authError = document.getElementById('authError');
        const materialForm = document.getElementById('materialForm');

        let localInventoryCached = [];

        // Check if browser has an active user log history session on render
        checkUserSession();

        async function checkUserSession() {
            const { data } = await supabase.auth.getSession();
            if (data?.session) {
                showDashboard();
            }
        }

        // --- AUTH SUBMIT PROCESSING ENGINE ---
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            authError.textContent = "Connecting to database...";
            authError.style.color = "var(--primary)";
            loginBtn.disabled = true;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: loginEmail.value.trim(),
                password: loginPassword.value
            });

            if (error) {
                authError.textContent = "❌ " + error.message;
                authError.style.color = "var(--danger)";
                loginBtn.disabled = false;
            } else {
                authError.textContent = "";
                showDashboard();
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        function showDashboard() {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            loadInventory();
        }

        // --- INVENTORY ROW WRITE CONTROLLER ---
        materialForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const tagsArray = document.getElementById('matTags').value.split(',')
                .map(t => t.trim()).filter(t => t.length > 0);

            const { data: userData } = await supabase.auth.getUser();

            const { error } = await supabase.from('materials').insert([{
                material_name: document.getElementById('matName').value,
                location: document.getElementById('matLoc').value,
                quantity: parseInt(document.getElementById('matQty').value) || 0,
                min_threshold: parseInt(document.getElementById('matAlert').value) || 0,
                image_url: document.getElementById('matImg').value || null,
